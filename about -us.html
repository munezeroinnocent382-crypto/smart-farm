<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculater</title>
    <link rel="stylesheet" href="public/css/calculator.css" />
  </head>
  <body>
    <div class="calc"><h1>Calculator</h1></div>
    <div class="one">
      <div class="one-one">
        <div class="two"></div>
      </div>

      <div class="button">
        <div class="up-buttons">
          <button class="clean" onclick="">AC</button>
          <button class="del" onclick="">DEL</button>
          <button class="per" onclick="">%</button>
          <button class="div" onclick="">/</button>
        </div>

        <div middle-button>
          <button onclick="">7</button>
          <button onclick="">8</button>
          <button onclick="">9</button>
        </div>

        <div class="two-middle-button">
          <button onclick="">4</button>
          <button onclick="">5</button>
          <button onclick="">6</button>
        </div>

        <div class="three-middle-button">
          <button onclick="">1</button>
          <button onclick="">2</button>
          <button onclick="">3</button>
        </div>

        <div class="four-middle-button">
          <button onclick="">+</button>
          <button onclick="">0</button>
          <button onclick="">.</button>
          <button onclick="">*</button>
          <button onclick="">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
